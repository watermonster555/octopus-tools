<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交际应用精讲 · 卷二</title>
<style>
  :root{--bg1:#0e1226;--bg2:#1a2145;--card:#fff;--muted:#6b7391;--line:rgba(255,255,255,.12);--ok:#7be3a8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 15% 0%,#243060 0%,var(--bg2) 45%,var(--bg1) 100%);
    color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}
  .topbar{display:flex;align-items:center;gap:9px;padding:12px 20px;flex-wrap:wrap;
    background:rgba(10,14,32,.55);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .brand{font-weight:700;display:flex;align-items:center;gap:9px;font-size:15px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#7ba2ff,#ff8a6a);box-shadow:0 0 12px #7ba2ff;}
  .spacer{flex:1;}
  .tbtn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#e8ecff;
    padding:8px 13px;border-radius:10px;font-size:13px;cursor:pointer;transition:.18s;font-family:inherit;}
  .tbtn:hover{background:rgba(255,255,255,.14);}
  .tbtn.on{background:linear-gradient(135deg,#4f7cff,#3a5fd9);border-color:transparent;}
  .tabbtn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#e8ecff;
    padding:9px 18px;border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:700;font-family:inherit;transition:.2s;}
  .tabbtn.on{background:linear-gradient(135deg,#4f7cff,#ff7a59);border-color:transparent;color:#fff;}
  .answerbar{margin:13px 20px 0;padding:10px 16px;border-radius:12px;
    background:rgba(123,227,168,.09);border:1px solid rgba(123,227,168,.3);font-size:14.5px;color:#c9f5dc;}
  .answerbar b{color:var(--ok);letter-spacing:2px;font-size:15.5px;}
  .chat{flex:1;overflow-y:auto;padding:18px 20px 8px;display:flex;flex-direction:column;gap:12px;}
  .chat::-webkit-scrollbar{width:8px;}
  .chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;}
  .row{display:flex;gap:11px;align-items:flex-start;max-width:840px;width:100%;margin:0 auto;transition:opacity .3s;}
  .row.b{flex-direction:row-reverse;}
  .ava{width:54px;height:54px;border-radius:50%;flex-shrink:0;overflow:hidden;
    border:3px solid rgba(255,255,255,.15);transition:.3s;cursor:pointer;}
  .row.a .ava{background:linear-gradient(160deg,#cfe0ff,#9ab8ff);}
  .row.b .ava{background:linear-gradient(160deg,#ffd8cb,#ffab8f);}
  .row.act .ava{border-color:#4f7cff;box-shadow:0 0 0 5px rgba(79,124,255,.22);animation:tb 1.1s ease-in-out infinite;}
  .row.b.act .ava{border-color:#ff7a59;box-shadow:0 0 0 5px rgba(255,122,89,.22);}
  @keyframes tb{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .msg{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:17px;
    padding:12px 17px;font-size:clamp(15px,1.55vw,18px);line-height:1.55;
    color:rgba(255,255,255,.8);transition:.35s;max-width:100%;cursor:pointer;}
  .row.act .msg{background:var(--card);color:#141a33;font-weight:600;transform:scale(1.02);box-shadow:0 14px 34px rgba(0,0,0,.4);}
  .row.a.act .msg{box-shadow:0 14px 34px rgba(79,124,255,.35);}
  .row.b.act .msg{box-shadow:0 14px 34px rgba(255,122,89,.32);}
  .cn{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:5px;}
  .blankTag{display:inline-flex;align-items:center;background:rgba(255,122,89,.15);
    border:1px dashed rgba(255,122,89,.6);color:#ffb39d;border-radius:7px;padding:1px 9px;font-weight:800;font-size:.9em;margin:0 3px;}
  .row.act .blankTag{background:#fff3ec;color:#e8543a;border-color:#ff7a59;}
  .ansTag{display:inline-flex;align-items:center;background:rgba(123,227,168,.18);
    border:1px solid rgba(123,227,168,.7);color:#7be3a8;border-radius:7px;padding:1px 9px;font-weight:800;font-size:.9em;margin:0 3px;}
  .row.act .ansTag{background:#eafaf1;color:#1d9e5f;border-color:#7be3a8;}
  .no{font-size:11px;color:var(--muted);align-self:center;flex-shrink:0;width:24px;text-align:center;font-weight:700;}
  .row.b .no{order:3;}
  .explain{max-width:840px;width:100%;margin:4px auto 18px;display:none;flex-direction:column;gap:11px;padding:0 20px;}
  .explain.show{display:flex;}
  .ecard{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:3px solid var(--ok);
    border-radius:12px;padding:13px 17px;font-size:14px;line-height:1.68;color:#dbe3ff;}
  .ecard b{color:var(--ok);}
  .ecard .ewhy{color:#b9c2e8;font-size:13px;display:block;margin-top:4px;}
  .controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 20px 20px;flex-wrap:wrap;
    background:linear-gradient(to top,rgba(8,11,26,.9),transparent);}
  .cbtn{border:none;border-radius:13px;padding:12px 22px;font-size:14.5px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:.2s;display:inline-flex;align-items:center;gap:8px;}
  .cbtn.play{background:linear-gradient(135deg,#4f7cff,#2f4fd0);color:#fff;
    box-shadow:0 10px 26px rgba(79,124,255,.45);min-width:140px;justify-content:center;}
  .cbtn.play:disabled{opacity:.5;cursor:default;}
  .cbtn.ghost{background:rgba(255,255,255,.08);color:#dbe3ff;border:1px solid var(--line);}
  .cbtn.ghost:disabled{opacity:.35;cursor:default;}
  .progress{width:min(340px,50vw);height:6px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f7cff,#ff7a59);transition:width .35s;}
  .step{font-size:12.5px;color:var(--muted);min-width:46px;text-align:center;}
  .tip{text-align:center;font-size:12px;color:#7b84a6;padding-bottom:10px;}
  @media(max-width:700px){.ava{width:42px;height:42px;}.msg{font-size:14.5px;padding:10px 14px;}.no{display:none;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span><span class="t">交际应用精讲 · 卷二</span></div>
  <div class="spacer"></div>
  <button class="tabbtn on" id="tabA">对话 A（13 句）</button><button class="tabbtn" id="tabB">对话 B（12 句）</button>
  <div class="spacer"></div>
  <button class="tbtn" id="btnCN">中文翻译</button>
  <button class="tbtn" id="btnAns">显示答案</button>
  <button class="tbtn" id="btnRate">语速 正常</button>
  <button class="tbtn" id="btnFull">⛶ 全屏</button>
</div>
<div class="answerbar" id="ansbar"></div>
<div class="chat" id="chat"></div>
<div class="explain" id="explain"></div>
<div class="tip">点击任意一句可单独重听 · 空格播放/暂停 · ← → 切换句子</div>
<div class="controls">
  <button class="cbtn ghost" id="btnPrev" disabled>◀ 上一句</button>
  <button class="cbtn play" id="btnPlay">▶ 开始播放</button>
  <button class="cbtn ghost" id="btnNext" disabled>下一句 ▶</button>
  <button class="cbtn ghost" id="btnExp">📖 讲解</button>
  <div class="progress"><i id="bar"></i></div>
  <span class="step" id="step">0 / 0</span>
</div>

const DIALOGS = {"A": {"title": "对话A · 电话订披萨　（A 店员 Jenny / B 顾客）", "lines": [{"who": "A", "en": "Hello, Happy Pizza. How can I help you?", "cn": "您好，Happy Pizza 披萨店。有什么可以帮您？", "no": 1, "ans": "C"}, {"who": "B", "en": "Hi, I'd like to order a pizza for delivery, please.", "cn": "你好，我想订一份外卖披萨。"}, {"who": "A", "en": "What size and toppings would you like?", "cn": "您想要什么尺寸、什么配料的呢？", "no": 2, "ans": "A"}, {"who": "B", "en": "A large seafood pizza, please. Can I have extra cheese on it?", "cn": "要一个大号海鲜披萨。能多加一点芝士吗？"}, {"who": "A", "en": "Of course. Do you have any other special requests?", "cn": "当然可以。您还有其他特别要求吗？"}, {"who": "B", "en": "Don't make it with onions, because my sister doesn't like them.", "cn": "不要放洋葱，因为我妹妹不喜欢吃。"}, {"who": "A", "en": "No problem. What's your address for delivery?", "cn": "没问题。您的配送地址是哪里？", "no": 3, "ans": "E"}, {"who": "B", "en": "Apartment 302, 15 Peace Street.", "cn": "和平街 15 号 302 室。"}, {"who": "A", "en": "Thanks. How would you like to pay, by card or cash?", "cn": "好的。您想怎么付款，刷卡还是现金？"}, {"who": "B", "en": "Cash, please. How long will it take?", "cn": "现金。大概要等多久？", "no": 4, "ans": "G"}, {"who": "A", "en": "About 30 minutes.", "cn": "大约 30 分钟。"}, {"who": "B", "en": "How much is the total?", "cn": "一共多少钱？", "no": 5, "ans": "D"}, {"who": "A", "en": "Your total is $25. Thank you for your order!", "cn": "一共 25 美元。感谢您的订购！"}], "explain": [{"no": 1, "ans": "C", "en": "How can I help you?", "zh": "这是店员接电话的开场白。前句 A 自报店名「Hello, Happy Pizza.」，后句 B 立刻说「我想订披萨」，说明空格是服务用语「有什么可以帮您？」。"}, {"no": 2, "ans": "A", "en": "What size and toppings would you like?", "zh": "下文 B 回答「大号海鲜披萨、多加芝士」——说的是尺寸（large）和配料（seafood、cheese），所以店员问的是「您要什么尺寸和配料？」。"}, {"no": 3, "ans": "E", "en": "What's your address for delivery?", "zh": "下文 B 回答「和平街 15 号 302 室」，是具体地址；且这是外卖（delivery），故店员问「您的配送地址是哪里？」。"}, {"no": 4, "ans": "G", "en": "How long will it take?", "zh": "下文 A 回答「About 30 minutes.（大约 30 分钟）」是时间段，说明 B 问的是「要多久送到？」。"}, {"no": 5, "ans": "D", "en": "How much is the total?", "zh": "下文   allReady=true;
}
function stopAll(){ if(CUR_AUDIO){try{CUR_AUDIO.onended=null;CUR_AUDIO.pause();}catch(e){} CUR_AUDIO=null;} }
function playLine(i){
  return new Promise(res=>{
    const key="d"+cur+"_"+String(i).padStart(2,"0");
    const url=BLOBS[key];
    if(!url){res();return;}
    stopAll();
    const a=new Audio(url); a.playbackRate=rate; CUR_AUDIO=a;
    let done=false;
    const fin=()=>{if(done)return;done=true;a.onended=null;a.onerror=null;res();};
    a.onended=fin;a.onerror=fin;
    const p=a.play();
    if(p&&p.catch)p.catch(()=>fin());
  });
}
function waitReady(t=5000){return new Promise(r=>{if(allReady){r();return;}const t0=Date.now();const iv=setInterval(()=>{if(allReady||Date.now()-t0>t){clearInterval(iv);r();}},100);});}
function fmt(l){
  if(l.no===undefined)return l.en;
  if(showAns)return l.en+' <span class="ansTag">'+l.no+'. '+l.ans+'</span>';
  return '<span class="blankTag">'+l.no+'. ______</span>';
}
function renderAll(){
  const d=DIALOGS[cur];
  chat.innerHTML="";
  d.lines.forEach((l,i)=>{
    const row=document.createElement("div");
    row.className="row "+(l.who==="A"?"a":"b");
    row.innerHTML=`<div class="ava">${l.who==="A"?AV_A:AV_B}</div>
      <div class="msg"><span class="tx"></span><span class="cn">${l.cn}</span></div>
      <span class="no">${l.no?(" "+l.no):""}</span>`;
    row.querySelector(".tx").innerHTML=fmt(l);
    row.querySelector(".msg").onclick=()=>{if(playing)stop();single(i);};
    row.querySelector(".ava").onclick=()=>{if(playing)stop();single(i);};
    chat.appendChild(row);
  });
  explain.innerHTML='<div class="ecard"><b>'+d.title+' · 逐题讲解</b></div>'+
    (d.explain||[]).map(e=>`<div class="ecard"><b>${e.no}. ${e.ans}</b>　${e.en}<span class="ewhy">${e.zh}</span></div>`).join("")+
    (d.unused?'<div class="ecard" style="border-left-color:#ffb39d"><b>多余选项</b><span class="ewhy" style="margin-top:2px">'+d.unused+'</span></div>':"");
  const ansList=d.lines.filter(l=>l.no!==undefined).map(l=>l.no+'.'+l.ans).join("　");
  $("ansbar").innerHTML='参考答案　'+ansList;
  renderPos();
  if(chat.scrollTop)chat.scrollTop=0;
}
function renderPos(){
  const rows=chat.children,n=DIALOGS[cur].lines.length;
  for(let i=0;i<rows.length;i++){
    rows[i].classList.toggle("act",i===idx);
    rows[i].style.opacity=(i===idx)?"1":Math.max(.42,1-Math.abs(i-idx)*.11);
  }
  bar.style.width=((idx+1)/n*100)+"%";
  step.textContent=(idx+1)+" / "+n;
  $("btnPrev").disabled=(idx===0);
  $("btnNext").disabled=(idx>=n-1);
}
function focus(i){chat.children[i].scrollIntoView({behavior:"smooth",block:"center"});}
async function single(i){
  const my=++seq;
  await waitReady();
  if(my!==seq)return;
  idx=i;renderPos();focus(i);
  playing=true;$("btnPlay").disabled=true;$("btnPlay").textContent="⏸ 播放中…";
  await playLine(i);
  if(my!==seq)return;
  playing=false;$("btnPlay").disabled=false;$("btnPlay").textContent="▶ 开始播放";
}
async function playFrom(s){
  const my=++seq;
  if(!allReady){$("btnPlay").textContent="准备中…";await waitReady();if(my!==seq)return;}
  playing=true;$("btnPlay").disabled=true;$("btnPlay").textContent="⏸ 播放中…";
  const n=DIALOGS[cur].lines.length;
  for(let i=s;i<n;i++){
    if(my!==seq||!playing)return;
    idx=i;renderPos();focus(i);
    await playLine(i);
    if(my!==seq||!playing)return;
    await new Promise(r=>setTimeout(r,420));
  }
  if(my!==seq)return;
  playing=false;$("btnPlay").disabled=false;$("btnPlay").textContent="↻ 重新播放";
}
function stop(){
  seq++;playing=false;stopAll();
  $("btnPlay").disabled=false;$("btnPlay").textContent="▶ 继续播放";
  const n=DIALOGS[cur].lines.length;
  $("btnPrev").disabled=(idx===0);
  $("btnNext").disabled=(idx>=n-1);
}
$("btnPlay").onclick=()=>{
  if(playing){stop();return;}
  const n=DIALOGS[cur].lines.length;
  const fin=(idx>=n-1)&&bar.style.width==="100%";
  playFrom(fin?0:idx);
};
$("btnNext").onclick=()=>{if(!playing&&idx<DIALOGS[cur].lines.length-1){idx++;renderPos();focus(idx);}};
$("btnPrev").onclick=()=>{if(!playing&&idx>0){idx--;renderPos();focus(idx);}};
$("btnExp").onclick=e=>{explain.classList.toggle("show");e.target.classList.toggle("on");};
$("btnCN").onclick=e=>{showCN=!showCN;e.target.classList.toggle("on",showCN);
  document.querySelectorAll(".cn").forEach(el=>el.style.display=showCN?"":"none");};
$("btnCN").classList.add("on");
$("btnAns").onclick=e=>{showAns=!showAns;e.target.classList.toggle("on",showAns);renderAll();};
$("btnAns").classList.add("on");
const RATES=[{v:1.0,l:"语速 正常"},{v:0.82,l:"语速 慢速"},{v:0.65,l:"语速 很慢"},{v:1.2,l:"语速 较快"}];
let ri=0;rate=RATES[0].v;
$("btnRate").onclick=e=>{
  ri=(ri+1)%RATES.length;rate=RATES[ri].v;
  e.target.textContent=RATES[ri].l;
  if(CUR_AUDIO)CUR_AUDIO.playbackRate=rate;
  e.target.classList.toggle("on",ri!==0);
};
$("btnFull").onclick=()=>{
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
};
KEYS.forEach(k=>{
  $("tab"+k).onclick=()=>{if(playing)stop();cur=k;idx=0;bar.style.width="0%";
    $("tab"+k).classList.add("on");KEYS.forEach(k2=>{if(k2!==k)$("tab"+k2).classList.remove("on");});
    renderAll();};
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();$("btnPlay").click();}
  if(e.code==="ArrowRight"&&!playing)$("btnNext").click();
  if(e.code==="ArrowLeft"&&!playing)$("btnPrev").click();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)stop();});
function boot(){
  prepareAll();
  if(DIALOGS[cur]&&DIALOGS[cur].lines.length){renderAll();$("btnPlay").disabled=false;}
  else{$("btnPlay").disabled=true;}
}
if(document.readyState==="loading"){window.addEventListener("DOMContentLoaded",boot);}
else{boot();}
</script>
</body>
</html>
